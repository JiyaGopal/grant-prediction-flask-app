<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STARTUP GRANT PREDICTOR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a2e0e6c77b.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --primary: #4a5dfc;
            --secondary: #a0aaf7;
            --accent: #28333d;
            --light: #f5f7fa;
            --dark: #030d18;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--accent);
        }

        .container {
            background-color: #fff;
            padding: 40px 50px;
            max-width: 800px;
            width: 95%;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            color: var(--primary);
        }

        .progress {
            background: #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            height: 12px;
            margin-bottom: 25px;
        }

        .progress-bar {
            background-color: var(--primary);
            width: 0%;
            height: 100%;
            transition: width 0.4s ease;
        }

        .form-step {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .form-step.active {
            display: block;
        }

        label {
            font-weight: 600;
            display: block;
            margin: 20px 0 8px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            transition: border 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
        }

        .step-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: #2e44d1;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            position: relative;
            animation: scaleFade 0.4s ease;
        }

        .modal-content h2 {
            margin-top: 0;
            color: var(--primary);
        }

        .modal-content ul li {
            background: var(--secondary);
            padding: 10px 16px;
            margin-bottom: 10px;
            border-radius: 8px;
            color: var(--accent);
            font-weight: 500;
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 20px;
            font-size: 24px;
            color: var(--primary);
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleFade {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fas fa-lightbulb"></i> STARTUP GRANT PREDICTOR</h1>

    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

    <form method="POST" action="/">
        <div class="form-step active">
            <label>Product Name</label>
            <input type="text" name="product_name" required>

            <label>Product Stage</label>
            <input type="text" name="product_stage" required>

            <label>Industry</label>
            <input type="text" name="industry" required>

            <label>Technology Domain</label>
            <input type="text" name="technology_domain" required>

            <div class="step-buttons">
                <span></span>
                <button type="button" class="btn" onclick="nextStep()">Next</button>
            </div>
        </div>

        <!-- Step 2 -->
        <div class="form-step">
            <label>Are you a Student Startup?</label>
            <select name="are_you_a_student_startup"><option>Yes</option><option>No</option></select>

            <label>Are you a Women's Startup?</label>
            <select name="are_you_a_womens_startup"><option>Yes</option><option>No</option></select>

            <label>Are you a Transgender Startup?</label>
            <select name="are_you_a_transgender_startup"><option>Yes</option><option>No</option></select>

            <label>Details of previous grants received from KSUM:</label>
            <select name="previous_grants_received_from_ksum"><option value="yes">Yes</option><option value="no">No</option></select>

            <div class="step-buttons">
                <button type="button" class="btn" onclick="prevStep()">Previous</button>
                <button type="button" class="btn" onclick="nextStep()">Next</button>
            </div>
        </div>

        <!-- Step 3 -->
        <div class="form-step">
            <label>Amount Received (INR)</label>
            <input type="number" name="amount" required>

            <label>Business Model</label>
            <input type="text" name="business_model" required>

            <label>Fund Raised (Last 2 years)</label>
            <input type="number" name="fund_raised_last_2_years">

            <label>Investments Made (Total)</label>
            <input type="number" name="investments_made_so_far" required>

            <label>Monthly Turnover (INR)</label>
            <input type="number" name="monthly_turnover">

            <div class="step-buttons">
                <button type="button" class="btn" onclick="prevStep()">Previous</button>
                <button type="submit" class="btn">Predict Eligible Grants</button>
            </div>
        </div>
    </form>
</div>

<!-- Modals -->
<div id="grantModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2><i class="fas fa-check-circle"></i> Eligible Grants</h2>
        <p>Based on your input, you are eligible for the following grants:</p>
        <ul id="grantList"></ul>
        <button class="btn" onclick="handleDone()" style="margin-top: 20px;">Done</button>
    </div>
</div>

<div id="successModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeSuccessModal()">&times;</span>
        <h2><i class="fas fa-thumbs-up"></i> All the Best!</h2>
        <p>We wish you great success in your startup journey.</p>
        <button class="btn" onclick="closeSuccessModal()" style="margin-top: 20px;">Thanks!</button>
    </div>
</div>

<script>
    const steps = document.querySelectorAll('.form-step');
    const progressBar = document.getElementById('progressBar');
    let currentStep = 0;

    function showStep(step) {
        steps.forEach((s, i) => s.classList.toggle('active', i === step));
        progressBar.style.width = ((step + 1) / steps.length) * 100 + '%';
    }

    function nextStep() {
        if (currentStep < steps.length - 1) {
            currentStep++;
            showStep(currentStep);
        }
    }

    function prevStep() {
        if (currentStep > 0) {
            currentStep--;
            showStep(currentStep);
        }
    }

    function showModal(grants) {
        const modal = document.getElementById('grantModal');
        const grantList = document.getElementById('grantList');
        grantList.innerHTML = '';
        grants.forEach(grant => {
            const li = document.createElement('li');
            li.textContent = grant;
            grantList.appendChild(li);
        });
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('grantModal').style.display = 'none';
    }

    function handleDone() {
        closeModal();
        setTimeout(() => {
            document.getElementById('successModal').style.display = 'flex';
        }, 300);
    }

    function closeSuccessModal() {
        document.getElementById('successModal').style.display = 'none';
    }

    showStep(currentStep);
</script>

{% if grants %}
<script>
    window.onload = function() {
        const grants = {{ grants|tojson }};
        showModal(grants);
    }
</script>
{% endif %}
</body>
</html>
